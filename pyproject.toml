[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad-at-risk"
version = "1.0.0"
description = "Early identification of at-risk students in the Open University Learning Analytics Dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Guangyu Feng" },
    { name = "Wai Chun Tam" },
    { name = "Xinyan Jiang" },
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
